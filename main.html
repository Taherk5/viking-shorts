<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="cv"></canvas>
<script src="lib.js"></script>
<script src="chars.js"></script>
<script src="world.js"></script>
<script src="scenes.js"></script>
<script src="scenes_short.js"></script>
<script>
const cv = document.getElementById('cv'); const SHORT = new URLSearchParams(location.search).get('short') === '1';
cv.width = (SHORT ? PW : W) * S; cv.height = (SHORT ? PH : H) * S;
const ctx = cv.getContext('2d'); ctx.scale(S, S);
window.renderFrame = (t) => { (SHORT ? drawFrameShort : drawFrame)(ctx, t); return true; };
window.frameJPEG = (q) => cv.toDataURL('image/jpeg', q || 0.93);
window.frameDuration = () => (SHORT ? TOTAL_P : TOTAL);
</script></body></html>
